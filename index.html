<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevKit - \u5f00\u53d1\u5de5\u5177\u7bb1</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      body {
        font-family: "Geist Variable", "Segoe UI", sans-serif;
        background: #ffffff;
        color: #111111;
      }
      html.dark body {
        background: #111111;
        color: #f3f3f3;
      }
      .boot {
        display: flex;
        height: 100%;
        width: 100%;
        align-items: center;
        justify-content: center;
        gap: 10px;
        flex-direction: column;
      }
      .boot-spinner {
        width: 22px;
        height: 22px;
        border: 2px solid #d4d4d8;
        border-top-color: #52525b;
        border-radius: 999px;
        animation: spin 0.8s linear infinite;
      }
      html.dark .boot-spinner {
        border-color: #3f3f46;
        border-top-color: #e4e4e7;
      }
      .boot-text {
        font-size: 12px;
        opacity: 0.8;
        min-height: 16px;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("devkit-theme");
          if (theme === "dark") document.documentElement.classList.add("dark");
          if (theme === "light") document.documentElement.classList.remove("dark");
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <div class="boot-spinner" aria-hidden="true"></div>
        <div class="boot-text" id="boot-text">DevKit 启动中...</div>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById("boot-text");
        if (!el) return;
        var started = Date.now();
        var phases = ["正在连接前端资源...", "正在初始化界面...", "正在加载工具模块..."];
        var i = 0;
        el.textContent = phases[0];
        var timer = setInterval(function () {
          var elapsed = Date.now() - started;
          if (elapsed > 12000) {
            el.textContent = "首次编译较慢，请稍候（后续会明显更快）...";
            clearInterval(timer);
            return;
          }
          i = (i + 1) % phases.length;
          el.textContent = phases[i];
        }, 1800);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
